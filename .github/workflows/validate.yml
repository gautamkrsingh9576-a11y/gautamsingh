name: Validate E-TECH Dashboard

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install production dependency
        run: npm install --omit=dev

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/trend-tracker.mjs

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
