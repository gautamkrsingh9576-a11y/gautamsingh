name: Deploy E-TECH Trend Radar to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Firebase runtime config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python - <<'PY'
          import json, os
          config = {
              "apiKey": os.environ.get("FIREBASE_API_KEY", ""),
              "authDomain": os.environ.get("FIREBASE_AUTH_DOMAIN", ""),
              "projectId": os.environ.get("FIREBASE_PROJECT_ID", ""),
              "storageBucket": os.environ.get("FIREBASE_STORAGE_BUCKET", ""),
              "messagingSenderId": os.environ.get("FIREBASE_MESSAGING_SENDER_ID", ""),
              "appId": os.environ.get("FIREBASE_APP_ID", ""),
          }
          with open("runtime-config.js", "w", encoding="utf-8") as f:
              f.write("window.__ETECH_FIREBASE_CONFIG__ = " + json.dumps(config) + ";\n")
          required = ["apiKey", "authDomain", "projectId", "appId"]
          print("Firebase web config:", "configured" if all(config[k] for k in required) else "not configured; dashboard will use local/demo fallback")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
